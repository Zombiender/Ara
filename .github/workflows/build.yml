
name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar Aura para Windows
    runs-on: windows-latest

    steps:
      # Baixar projeto
      - name: Baixar código
        uses: actions/checkout@v5

      # Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Rust
      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configurar cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Organizar arquivos
      - name: Organizar estrutura do Aura
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Move-File {
            param(
              [string]$File,
              [string]$Destination
            )

            if (Test-Path $File -PathType Leaf) {
              New-Item -ItemType Directory -Force -Path $Destination | Out-Null

              $Target = Join-Path $Destination (Split-Path $File -Leaf)

              if (-not (Test-Path $Target)) {
                Move-Item $File $Target
                Write-Host "Movido: $File -> $Target"
              }
            }
          }

          # Tauri
          New-Item -ItemType Directory -Force -Path "src-tauri/src" | Out-Null
          New-Item -ItemType Directory -Force -Path "src-tauri/capabilities" | Out-Null

          Move-File "Cargo.toml" "src-tauri"
          Move-File "build.rs" "src-tauri"
          Move-File "tauri.conf.json" "src-tauri"
          Move-File "default.json" "src-tauri/capabilities"
          Move-File "lib.rs" "src-tauri/src"
          Move-File "main.rs" "src-tauri/src"

          # Frontend
          New-Item -ItemType Directory -Force -Path "src/core" | Out-Null
          New-Item -ItemType Directory -Force -Path "src/ui" | Out-Null

          Move-File "main.ts" "src"
          Move-File "welcome.ts" "src"

          # Componentes React
          Get-ChildItem -File -Filter "*.tsx" |
            ForEach-Object {
              Move-File $_.Name "src/ui"
            }

          Move-File "index.css" "src/ui"

          # Arquivos de lógica
          Get-ChildItem -File -Filter "*.ts" |
            Where-Object {
              $_.Name -notin @("vite.config.ts")
            } |
            ForEach-Object {
              Move-File $_.Name "src/core"
            }

          # Verificação
          Write-Host "Verificando arquivos..."
          if (-not (Test-Path "vite.config.ts")) {
            throw "vite.config.ts não encontrado"
          }

          if (-not (Test-Path "src/main.ts")) {
            throw "src/main.ts não encontrado"
          }

          if (-not (Test-Path "src/ui/montar.tsx")) {
            throw "src/ui/montar.tsx não encontrado"
          }

          # Configuração TypeScript
          @'
          {
            "compilerOptions": {
              "target": "ES2022",
              "useDefineForClassFields": true,
              "lib": [
                "ES2022",
                "DOM",
                "DOM.Iterable"
              ],
              "module": "ESNext",
              "skipLibCheck": true,
              "moduleResolution": "Bundler",
              "allowImportingTsExtensions": true,
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "react-jsx",
              "strict": false,
              "noUnusedLocals": false,
              "noUnusedParameters": false,
              "types": [
                "node",
                "vite/client"
              ]
            },
            "include": [
              "src",
              "vite.config.ts"
            ]
          }
          '@ | Set-Content "tsconfig.json" -Encoding utf8

      # Dependências
      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      # CORREÇÃO DO ERRO node:url
      - name: Instalar tipos do Node.js
        run: npm install --no-save @types/node --no-audit --no-fund

      # Verificar TypeScript
      - name: Verificar configuração TypeScript
        run: npx tsc --noEmit

      # Ícones
      - name: Gerar ícones do Aura
        run: npx tauri icon app-icon.png

      # Variáveis de ambiente
      - name: Configurar variáveis
        shell: pwsh
        env:
          VITE_NOME_ASSISTENTE: ${{ secrets.VITE_NOME_ASSISTENTE }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: ${{ secrets.VITE_GEMINI_MODEL }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
          VITE_SPOTIFY_REFRESH_TOKEN: ${{ secrets.VITE_SPOTIFY_REFRESH_TOKEN }}
          VITE_CHAVE_PIX: ${{ secrets.VITE_CHAVE_PIX }}
        run: |
          $lines = @(
            "VITE_NOME_ASSISTENTE=$env:VITE_NOME_ASSISTENTE"
            "VITE_GEMINI_API_KEY=$env:VITE_GEMINI_API_KEY"
            "VITE_GEMINI_MODEL=$env:VITE_GEMINI_MODEL"
            "VITE_SPOTIFY_CLIENT_ID=$env:VITE_SPOTIFY_CLIENT_ID"
            "VITE_SPOTIFY_REFRESH_TOKEN=$env:VITE_SPOTIFY_REFRESH_TOKEN"
            "VITE_CHAVE_PIX=$env:VITE_CHAVE_PIX"
          )

          [System.IO.File]::WriteAllLines(
            ".env",
            $lines,
            [System.Text.UTF8Encoding]::new($false)
          )

      # Compilação
      - name: Compilar Aura
        run: npm run tauri -- build

      # Disponibilizar instalador
      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Aura-instalador-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
